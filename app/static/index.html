<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enterprise Service Desk_V1</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 6px 0 0;
            color: #d1d5db;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 14px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .ticket {
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .ticket:last-child {
            margin-bottom: 0;
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 8px;
        }

        .ticket-title {
            font-weight: bold;
            font-size: 17px;
        }

        .ticket-id {
            color: #6b7280;
            font-size: 13px;
        }

        .ticket-description {
            margin: 10px 0;
            color: #4b5563;
        }

        .ticket-details {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 13px;
        }

        .badge {
            background: #f3f4f6;
            padding: 5px 9px;
            border-radius: 4px;
        }

        .support-update {
            margin-top: 15px;
            padding: 12px;
            background: #f9fafb;
            border-left: 4px solid #2563eb;
            border-radius: 4px;
        }

        .support-update-title {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .support-update-text {
            color: #4b5563;
        }

        .empty {
            color: #6b7280;
        }
    </style>
</head>

<body>

<header>
    <h1>Enterprise Service Desk</h1>
    <p>Service Request & Incident Management Platform</p>
</header>

<main>

    <section class="card">
        <h2>Create Ticket</h2>

        <form id="ticketForm">

            <div class="form-group">
                <label for="title">Title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Enter ticket title"
                    required
                >
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                    placeholder="Describe the issue or request"
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <label for="ticket_type">Type</label>
                <select id="ticket_type" name="ticket_type" required>
                    <option value="">Select type</option>
                    <option value="Incident">Incident</option>
                    <option value="Service Request">Service Request</option>
                </select>
            </div>

            <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority" name="priority" required>
                    <option value="">Select priority</option>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>

            <button type="submit">Create Ticket</button>

            <div id="message"></div>

        </form>
    </section>


    <section class="card">
        <h2>My Tickets</h2>

        <div id="tickets">
            <p class="empty">Loading tickets...</p>
        </div>
    </section>

</main>


<script>

    const ticketForm = document.getElementById("ticketForm");
    const message = document.getElementById("message");
    const ticketsContainer = document.getElementById("tickets");


    async function loadTickets() {

        try {

            const response = await fetch("/tickets");

            if (!response.ok) {
                throw new Error("Failed to load tickets");
            }

            const tickets = await response.json();


            if (tickets.length === 0) {

                ticketsContainer.innerHTML =
                    '<p class="empty">No tickets have been created yet.</p>';

                return;
            }


            ticketsContainer.innerHTML = tickets.map(ticket => `

                <div class="ticket">

                    <div class="ticket-header">

                        <div class="ticket-title">
                            ${escapeHtml(ticket.title)}
                        </div>

                        <div class="ticket-id">
                            Ticket #${ticket.id}
                        </div>

                    </div>


                    <div class="ticket-description">
                        ${escapeHtml(ticket.description)}
                    </div>


                    <div class="ticket-details">

                        <span class="badge">
                            Type: ${escapeHtml(ticket.ticket_type)}
                        </span>

                        <span class="badge">
                            Priority: ${escapeHtml(ticket.priority)}
                        </span>

                        <span class="badge">
                            Status: ${escapeHtml(ticket.status)}
                        </span>

                        <span class="badge">
                            Created: ${formatDate(ticket.created_at)}
                        </span>

                    </div>


                    ${
                        ticket.support_update
                        ? `
                            <div class="support-update">

                                <div class="support-update-title">
                                    Support Engineer Update
                                </div>

                                <div class="support-update-text">
                                    ${escapeHtml(ticket.support_update)}
                                </div>

                            </div>
                        `
                        : ""
                    }

                </div>

            `).join("");


        } catch (error) {

            ticketsContainer.innerHTML =
                '<p class="empty">Unable to load tickets.</p>';

        }
    }


    ticketForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        message.textContent = "Creating ticket...";


        const ticketData = {

            title: document.getElementById("title").value,

            description:
                document.getElementById("description").value,

            ticket_type:
                document.getElementById("ticket_type").value,

            priority:
                document.getElementById("priority").value

        };


        try {

            const response = await fetch("/tickets", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(ticketData)

            });


            if (!response.ok) {
                throw new Error("Failed to create ticket");
            }


            message.textContent =
                "Ticket created successfully.";


            ticketForm.reset();


            await loadTickets();


        } catch (error) {

            message.textContent =
                "Unable to create ticket. Please try again.";

        }

    });


    function escapeHtml(value) {

        const div = document.createElement("div");

        div.textContent = value;

        return div.innerHTML;

    }


    function formatDate(value) {

        if (!value) {
            return "";
        }

        return new Date(value).toLocaleString();

    }


    loadTickets();

</script>

</body>
</html>
