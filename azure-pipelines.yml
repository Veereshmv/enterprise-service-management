trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: 'EnterpriseServiceDesk-Pool'

variables:
  - group: EnterpriseServiceDesk-Secrets

steps:
  - script: |
      python --version
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install -r requirements-dev.txt
    displayName: 'Install dependencies'

  - script: |
      python -m ruff check .
    displayName: 'Run code quality checks'

  - script: |
      python -m pytest -v
    displayName: 'Run automated tests'
    env:
      DB_SERVER: $(DB-SERVER)
      DB_NAME: $(DB-NAME)
      DB_USER: $(DB-USER)
      DB_PASSWORD: $(DB-PASSWORD)

  - script: |
      python -m pip_audit -r requirements.txt
    displayName: 'Run dependency security scan'