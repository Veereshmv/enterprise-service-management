trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: 'Default'

variables:
  - group: EnterpriseServiceDesk-Secrets

steps:
  - script: |
      python3 --version
      python3 -m venv .venv
      . .venv/bin/activate
      python -m pip install --upgrade pip
      python -m pip install -r requirements.txt
      python -m pip install -r requirements-dev.txt
    displayName: 'Install dependencies'

  - script: |
      . .venv/bin/activate
      python -m ruff check .
    displayName: 'Run code quality checks'

  - script: |
      if [ -n "$DB_SERVER" ]; then echo "DB_SERVER is set"; else echo "DB_SERVER is NOT set"; fi
      if [ -n "$DB_NAME" ]; then echo "DB_NAME is set"; else echo "DB_NAME is NOT set"; fi
      if [ -n "$DB_USER" ]; then echo "DB_USER is set"; else echo "DB_USER is NOT set"; fi
      if [ -n "$DB_PASSWORD" ]; then echo "DB_PASSWORD is set"; else echo "DB_PASSWORD is NOT set"; fi
    displayName: 'Verify database variables'
    env:
      DB_SERVER: $(DB-SERVER)
      DB_NAME: $(DB-NAME)
      DB_USER: $(DB-USER)
      DB_PASSWORD: $(DB-PASSWORD)

  - script: |
      . .venv/bin/activate
      python -m pytest -v
    displayName: 'Run automated tests'
    env:
      DB_SERVER: $(DB-SERVER)
      DB_NAME: $(DB-NAME)
      DB_USER: $(DB-USER)
      DB_PASSWORD: $(DB-PASSWORD)

  - script: |
      . .venv/bin/activate
      python -m pip_audit -r requirements.txt
    displayName: 'Run dependency security scan'

  - script: |
      docker build -t enterprise-servicedesk:$(Build.BuildId) .
    displayName: 'Build Docker image'

  - task: AzureCLI@2
    displayName: 'Login to Azure Container Registry'
    inputs:
      azureSubscription: 'EnterpriseServiceDesk-Azure'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az acr login --name taskhubacrdev260826

  - script: |
      docker tag enterprise-servicedesk:$(Build.BuildId) taskhubacrdev260826.azurecr.io/enterprise-servicedesk:$(Build.BuildId)
      docker push taskhubacrdev260826.azurecr.io/enterprise-servicedesk:$(Build.BuildId)
    displayName: 'Push Docker image to ACR'