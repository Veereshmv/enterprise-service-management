parameters:
  - name: imageTag
    displayName: 'Docker image tag to deploy'
    type: string
    default: '65'

trigger: none

pr: none

pool:
  name: 'Default'

variables:
  azureSubscription: 'EnterpriseServiceDesk-Azure'
  resourceGroup: 'rg-enterprise-service'
  appName: 'enterprise-servicedesk-app'
  acrName: 'taskhubacrdev260826'
  imageRepository: 'enterprise-servicedesk'

steps:

  - task: AzureCLI@2
    displayName: 'Deploy container to Azure App Service'
    inputs:
      azureSubscription: '$(azureSubscription)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        echo "Deploying image:"
        echo "$(acrName).azurecr.io/$(imageRepository):${{ parameters.imageTag }}"

        az webapp config container set \
          --name "$(appName)" \
          --resource-group "$(resourceGroup)" \
          --docker-custom-image-name "$(acrName).azurecr.io/$(imageRepository):${{ parameters.imageTag }}" \
          --docker-registry-server-url "https://$(acrName).azurecr.io"

        az webapp restart \
          --name "$(appName)" \
          --resource-group "$(resourceGroup)"